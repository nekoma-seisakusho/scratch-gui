<svg xmlns="http://www.w3.org/2000/svg" width="106" height="98" viewBox="0 0 106 98">
  <!-- KidsBoard: cat-eared board (blinking) -->
  <g transform="scale(0.4) translate(-168 -45)">
    <!-- ears -->
    <polygon points="215,110 235,45 285,90" fill="#FF8C1A"/>
    <polygon points="385,110 365,45 315,90" fill="#FF8C1A"/>
    <polygon points="228,98 238,63 262,85" fill="#FFD9A8"/>
    <polygon points="372,98 362,63 338,85" fill="#FFD9A8"/>
    <!-- PCB -->
    <rect x="180" y="90" width="240" height="200" rx="24" fill="#FF8C1A"/>
    <rect x="196" y="106" width="208" height="168" rx="16" fill="#FFA94D"/>
    <!-- corner connectors -->
    <rect x="168" y="102" width="24" height="36" rx="4" fill="#8D6E63"/>
    <rect x="408" y="102" width="24" height="36" rx="4" fill="#8D6E63"/>
    <rect x="168" y="234" width="24" height="36" rx="4" fill="#8D6E63"/>
    <rect x="408" y="234" width="24" height="36" rx="4" fill="#8D6E63"/>
    <!-- face: closed happy eyes -->
    <path d="M 244 172 Q 258 158 272 172" stroke="#5D4037" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M 328 172 Q 342 158 356 172" stroke="#5D4037" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- mouth / speaker -->
    <path d="M 272 210 Q 300 236 328 210" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- LED dot (lit) -->
    <circle cx="222" cy="128" r="10" fill="#8BC34A"/>
  </g>
</svg>
